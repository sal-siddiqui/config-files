# ~/.config/tmux/tmux.conf

# Render colors properly
set-option -g default-terminal    "$TERM"
set-option -sg terminal-overrides ",*:RGB"

# Status bar
set-option -g status-style 'bg=default'
set-option -g status-left  '  '
set-option -g status-right '#[fg=white]#S\
#{?client_prefix,#[fg=white] (Prefix Pressed),}\
#{?window_zoomed_flag,#[fg=white] (Zoomed),}'

# Windows
set-option -g window-status-format         '#W'
set-option -g window-status-current-format '#W'
set-option -g base-index        '1'
set-option -g renumber-windows  'on'
set-option -g allow-rename      'off'
set-option -g  monitor-activity 'on'

# Copy Mode
set-option -g mode-keys 'vi'

# Keybindings
unbind-key C-b
set-option -g prefix C-Space

unbind r
bind-key r {
	source-file ~/.config/tmux/tmux.conf
	display "Reloaded tmux config"
}

bind-key '-n' 'C-Right' 'next-window'
bind-key '-n' 'C-Left' 'previous-window'

bind-key '-n' 'C-S-Right' 'swap-window -d -t +1'
bind-key '-n' 'C-S-Left' 'swap-window -d -t -1'

# Colors
set-option -g window-status-separator       ' #[fg=gray]ΓÇô '
set-option -g window-status-style           'fg=gray,bg=default'
set-option -g window-status-current-style   'fg=white,bg=default'
set-option -g window-status-bell-style      'fg=red,bg=default'
set-option -g window-status-activity-style  'fg=red,bg=default'

set-option -g pane-border-style             'fg=#141414,bg=default'
set-option -g pane-active-border-style      'fg=white,bg=default'

set-option -g menu-selected-style           'fg=black,bg=white'
set-option -g menu-border-style             'fg=white,bg=default'
set-option -g message-style                 'fg=white,bg=default'
set-option -g prompt-cursor-colour          '#FFFFFF'
set-option -g prompt-cursor-style           'block'

set-option -g mode-style                    'fg=default,bg=black'
set-option -g copy-mode-match-style         'fg=white,bg=black'
set-option -g copy-mode-match-style         'fg=white,bg=black'
set-option -g copy-mode-current-match-style 'fg=black,bg=white'
